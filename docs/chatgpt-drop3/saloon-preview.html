<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frontier saloon upgrade preview</title>
<style>body{margin:0;background:#171b1b;color:#f4dfb9;font:14px system-ui}canvas{display:block}#guide{position:fixed;top:10px;left:10px;right:10px;z-index:10;pointer-events:none}#guide b{font:700 22px Georgia}#guide button{pointer-events:auto;min-height:38px;margin:3px;padding:7px 12px;background:#34271c;color:#f1d29a;border:1px solid #aa854d;border-radius:5px}#hint{position:fixed;bottom:14px;left:15px;z-index:10;padding:8px;background:#151512b9}#status{color:#dcb778}#error{max-width:760px;line-height:1.5}</style>
<script type="importmap">{"imports":{"three":"./three.module.js"}}</script>
<div id="guide"><b>THE RED GARTER · FRONTIER EDITION</b><p>WASD move · click scene to look · E interact · Esc release/leave · U buy/equip suppressor · R reload sound · hold fire in gun showcase</p><div><button id="demo-saloon">Saloon</button><button id="demo-poker">Texas Hold’em</button><button id="demo-blackjack">Blackjack</button><button id="demo-slots">Themed slots</button><button id="demo-people">Four player variants</button><button id="demo-gun">Tommy gun</button></div><p id="status"></p><p id="error"></p></div><div id="hint"></div>
<script type="module">
import * as THREE from 'three';
import {createTown} from './src/hrtown.js';import {createSaloon} from './src/hrsaloon.js';import {createPlayerCharacter,poseFrontierCharacter} from './src/hrcharacters.js';import {buildTommyReplica,createTommyEffects} from './src/hrtommy.js';import {createTommySuppressorItem} from './src/hrtommy-store.js';
const $=id=>document.getElementById(id),q=new URLSearchParams(location.search),scene=new THREE.Scene();scene.background=new THREE.Color(0x747d7b);scene.fog=new THREE.FogExp2(0x747d7b,.012);scene.add(new THREE.HemisphereLight(0xc6d2d1,0x6b4e36,1.7));const sun=new THREE.DirectionalLight(0xffdfac,3);sun.position.set(-15,25,-12);scene.add(sun);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.05,200);camera.rotation.order='YXZ';let renderer=null;
if(!q.has('norender'))try{renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.appendChild(renderer.domElement);}catch(e){$('error').textContent='WebGL unavailable in this browser. Casino interface remains testable; no 3D preview is being rendered.';}
if(q.has('norender'))$('error').textContent='DOM-only test mode. No 3D rendering or GPU performance measurement.';
const ground=new THREE.Mesh(new THREE.PlaneGeometry(250,250).rotateX(-Math.PI/2),new THREE.MeshStandardMaterial({color:0x8b8064,roughness:1}));ground.position.y=-.025;scene.add(ground);
const H={me:'P1',t:0,fp:true,fv:new THREE.Vector2(),shake:0,netRole:()=> 'solo',netRemotes:()=>[]},P={pos:new THREE.Vector3(-6,.45,-2),yaw:Math.PI,pitch:0},keys={},input={};
const wallet={state:{score:15000,spent:0,owned:{tommy:true,gold:false,revolver:true,rifle:true,sniper:true},up:{tommy:0,gold:0,revolver:0,rifle:0,sniper:0}},pts(){return this.state.score-this.state.spent;},save(){},holster(){},PRICE:{tommy:1000,gold:5000},UP_COST:{},tier(){return 0;},maxAmmo(){return 50;},purchase(){},upgrade(){}};H.guns=wallet;
const say=(s)=>$('status').textContent=s;let town;const c={scene,H,P,camera,keys,input,mobile:q.has('low'),sfx:{},msg:say,hAt:()=>0,blocked:(x,z,r)=>town?town.wallHit(x,z,r,P.pos.y):false,zombies:()=>null};town=createTown(c);town.build({towers:[],town:[0,0,0]});const saloon=createSaloon({...c,T:town});
const people=[];for(let i=0;i<4;i++){const d=createPlayerCharacter(i,{quality:q.has('low')?'low':'high'});d.g.position.set(-11+i*2,0,-7);d.g.rotation.y=Math.PI;scene.add(d.g);people.push(d);}
const gun=buildTommyReplica();gun.group.position.set(-5,1.6,-8);gun.group.rotation.y=-Math.PI/2;scene.add(gun.group);gun.group.visible=false;const fx=createTommyEffects({scene,groundHeight:()=>0});const item=createTommySuppressorItem({weapon:gun,wallet:{spend(n){if(wallet.pts()<n)return false;wallet.state.spent+=n;return true;}},onChange:i=>say(i.equipped?'Suppressor equipped':'Suppressor removed')});town.registerStoreItem(item);
let showGun=false,fireHeld=false,shotT=0;function moveTo(x,y,z,yaw,pitch=0){saloon.close();P.pos.set(x,y,z);P.yaw=yaw;P.pitch=pitch;}
$('demo-saloon').onclick=()=>{showGun=false;moveTo(-6,.45,-2,Math.PI);};$('demo-poker').onclick=()=>saloon.casino.open('poker');$('demo-blackjack').onclick=()=>saloon.casino.open('blackjack');$('demo-slots').onclick=()=>{saloon.close();saloon.sit(0);};$('demo-people').onclick=()=>{showGun=false;moveTo(-8,0,-11,Math.PI,-.04);};$('demo-gun').onclick=()=>{showGun=true;moveTo(-3,0,-10,2.356,-.18);};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyE'&&!H.uiOpen)town.use();if(e.code==='KeyU'){item.state.owned?item.toggle():item.buy();}if(e.code==='KeyR'&&showGun)fx.sound.reload();});addEventListener('keyup',e=>keys[e.code]=false);addEventListener('blur',()=>{for(const k in keys)keys[k]=false;fireHeld=false;});addEventListener('mouseup',()=>fireHeld=false);
renderer?.domElement.addEventListener('mousedown',e=>{if(e.button!==0)return;if(!document.pointerLockElement)renderer.domElement.requestPointerLock();else fireHeld=true;fx.sound.init();});addEventListener('mousemove',e=>{if(renderer&&document.pointerLockElement===renderer.domElement){P.yaw-=e.movementX*.0022;P.pitch=Math.max(-1.4,Math.min(1.4,P.pitch-e.movementY*.0022));}});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer?.setSize(innerWidth,innerHeight);});
let last=performance.now();function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;H.t+=dt;if(!H.uiOpen&&!H.seated){const f=(keys.KeyW?1:0)-(keys.KeyS?1:0),s=(keys.KeyD?1:0)-(keys.KeyA?1:0),speed=keys.ShiftLeft?5:2.5,dx=(-Math.sin(P.yaw)*f+Math.cos(P.yaw)*s)*speed*dt,dz=(-Math.cos(P.yaw)*f-Math.sin(P.yaw)*s)*speed*dt;if(!town.wallHit(P.pos.x+dx,P.pos.z,.3,P.pos.y))P.pos.x+=dx;if(!town.wallHit(P.pos.x,P.pos.z+dz,.3,P.pos.y))P.pos.z+=dz;P.pos.y=town.floorAt(P.pos.x,P.pos.z,P.pos.y);H.fv.set(dx/Math.max(dt,.001),dz/Math.max(dt,.001));}
 town.tick(dt);saloon.tick(dt);camera.position.copy(P.pos);camera.position.y+=1.55;camera.rotation.set(P.pitch,P.yaw,0);camera.updateMatrixWorld();saloon.postCam();for(const d of people)poseFrontierCharacter(d,dt);gun.group.visible=showGun;shotT=Math.max(0,shotT-dt);if(showGun&&fireHeld&&!H.uiOpen&&shotT===0){fx.emit(gun);shotT=.09;gun.bolt.position.z=.02;}gun.bolt.position.z+=(-.02-gun.bolt.position.z)*Math.min(1,dt*25);fx.update(dt);renderer?.render(scene,camera);$('hint').textContent=town.label(town.nearSpot())||'Explore the saloon and casino · '+wallet.pts()+' game points';}requestAnimationFrame(frame);
window.__frontierPreview={H,P,town,saloon,gun,fx,people};
</script></html>
