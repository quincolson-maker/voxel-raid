<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>Voxel Raid: Bastion Breakers</title>
<style>
body{margin:0;overflow:hidden;background:#000;font-family:monospace;color:#fff}
#hud{position:fixed;inset:0;pointer-events:none}
#top{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#0008;padding:6px 14px;border-radius:6px;font-size:16px;text-align:center}
#bot{position:absolute;bottom:10px;left:10px;background:#0008;padding:8px;border-radius:6px;font-size:14px;white-space:pre}
#right{position:absolute;bottom:10px;right:10px;background:#0008;padding:8px;border-radius:6px;font-size:13px;white-space:pre}
#cross{position:absolute;top:50%;left:50%;width:14px;height:14px;margin:-7px;border:2px solid #fff;border-radius:50%}
#msg{position:absolute;top:30%;width:100%;text-align:center;font-size:28px;text-shadow:0 0 6px #000}
.panel{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0f1ccc;gap:10px}
button,select,input{font:16px monospace;padding:8px 14px;border-radius:6px;border:1px solid #888;background:#223;color:#fff;cursor:pointer}
h1{color:#ffcf4a;margin:0}
</style>
<script type="importmap">{"imports":{"three":"./three.module.js"}}</script>
</head><body>
<div id="hud" style="display:none"><div id="top"></div><div id="cross"></div><div id="msg"></div><div id="bot"></div><div id="right"></div></div>
<div id="menu" class="panel">
<h1>VOXEL RAID: Bastion Breakers</h1><div>An original voxel base-raid FPS prototype</div>
<button id="queue">Queue Match (random role)</button>
<div><button id="att">Play Attack</button> <button id="def">Play Defend</button></div>
<div>Base layout: <select id="layout"></select></div>
<div>Build phase (seconds): <input id="buildT" type="number" value="300" style="width:90px"></div>
<div style="font-size:13px;max-width:600px;text-align:center;opacity:.8">WASD move · Mouse look · Space jump · Shift sprint · LMB shoot · RMB place · Q cycle piece · Z cycle material · R reload · G skip phase (dev) · Esc release mouse</div>
</div>
<div id="end" class="panel" style="display:none"><h1 id="endT"></h1><div id="endS" style="font-size:20px;white-space:pre;text-align:center"></div><button onclick="location.href=location.pathname">Main Menu</button></div>
<script type="module" src="./main.js"></script>
</body></html>
